    owner: devops
    title: CI runner minutes
    category: ci
    provider: github
    unit: minute
    meter: report_api           # POST /v1/usage {resource: ci_minutes, quantity: 12}
    price: { usd_per_unit: 0.008 }
  cloud:
    class: consumable
    urn: urn:shield:compute:aws:account
    owner: finops
    title: Cloud bill (FOCUS import)
    category: compute
    provider: aws
    unit: usd
    meter: billing_export       # POST /v1/import/focus with a FOCUS CSV
    price: { usd_per_unit: 1.0 }
  simulator:
    class: leasable
    urn: urn:shield:device:apple:ios-simulator
    owner: dev-productivity
    title: iOS simulator
    category: device
    provider: apple
    unit: minute
    meter: mcp_tools
    actions: [start, use, stop]
    price: { usd_per_unit: 0.01 }
    lease:
      start_tools: [boot_simulator, boot-device]          # demo server, argent
      stop_tools: [shutdown_simulator]
      stop_all_tools: [stop-all-simulator-servers]
      activity_tools: ["simulator_*", "gesture-*", describe, screenshot, launch-app]
      handle: { pattern: "sim-[0-9a-f]{6}", arg: id }
      max_concurrent_per_principal: 2
      idle_minutes: 10
      auto_reclaim: true
  vm:
    class: leasable
    urn: urn:shield:compute:internal:sandbox-vm
    owner: dev-productivity
    title: Sandbox VM
    category: compute
