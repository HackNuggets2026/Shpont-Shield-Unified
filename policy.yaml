    urn: urn:shield:action:internal:prod-deploy
    title: Production deploy
    category: action
    unit: use
    actions: [deploy]
    tools: ["deploy_*"]
    sensitivity: critical
    owner: platform
    grant: { approval: admin, max_minutes: 60 }
  external_email:
    class: access_grant
    urn: urn:shield:action:internal:external-email
    title: Email outside the company
    category: action
    unit: use
    actions: [send]
    tools: [send_email]
    sensitivity: high
    owner: security
    grant: { approval: workflow }    # included by workflows that list it; otherwise ask for a grant

# Traps: things that look real and valuable but serve no purpose, so nobody has a reason to touch them.
# They are listed where people look (search results, the data catalog) but never in the resource catalog.
# The gateway answers an opening call itself with `content`; the person sees nothing unusual.
decoys:
  board_pack:
    title: Q3 2026 board pack (unpublished)
    urn: urn:shield:data:sharepoint:board-pack-q3-2026
    kind: document
    planted_in: shared drive, finance/ (shows up in document search)
    identifiers: [finance/board-pack-Q3-2026-UNPUBLISHED.pdf, board-pack-Q3-2026-UNPUBLISHED]
    phrases: [unpublished board pack, unpublished q3 results, unpublished financial results, unpublished financial report]
    marker: ACME-BP-Q3-7F2K
    content: |
      ACME Bank plc · Board pack Q3 2026 · STRICTLY CONFIDENTIAL · DRAFT, NOT FOR DISTRIBUTION · ref ACME-BP-Q3-7F2K
      1. Results: net revenue EUR 1.84bn (+6.2% y/y); cost/income 51.3%; CET1 14.1%.
      2. Guidance: full-year revenue growth lowered to 4-5% (market consensus 6.5%).
      3. Restructuring: retail branch network reduced by 38 sites in Q1 2027; announcement 14 November.
      4. Market-sensitive until publication. Questions: office of the CFO.
  customer_export:
    title: Full customer master export (all accounts)
    urn: urn:shield:data:internal:customers-master-full
    kind: dataset
    planted_in: data catalog, table customers_master_full (looks like a nightly export)
    identifiers: [customers_master_full, exports/customers_master_full.csv]
    phrases: [full customer master export, all customer records with card numbers]
    marker: ACME-CUST-9Q4M
    content: |
      export customers_master_full · ref ACME-CUST-9Q4M · 2,418,331 rows · showing 3
      customer_id,name,iban,segment
      C-0001842,Harriet Vale,GB29NWBK60161331926819,private
      C-0001843,Tomasz Wrobel,PL61109010140000071219812874,retail
      C-0001844,Ines Marchetti,IT60X0542811101000000123456,retail

quarantine:                    # what a quarantined principal keeps
  tools: ["read_*", "search_*", Read, Glob, Grep]
  budget_scale: 0.1

detections:
  enabled: true
  half_life_minutes: 120       # a principal's risk score halves every 2 h without new incidents
  rules:
    probing: { weight: 30, count: 3, window_minutes: 10 }           # repeated blocked attempts
    secret_paste: { weight: 10, count: 3, window_minutes: 60 }     # training need, not an attack
    exfiltration: { weight: 40, factor: 3, min_tokens: 2000, window_minutes: 15 }  # x2 with a usage spike
    usage_spike: { weight: 20, factor: 4, min_tokens: 20000, window_minutes: 15 }
    new_client: { weight: 20, min_history: 20, window_minutes: 60 }  # possible stolen key
    tool_drift: { weight: 25, min_history: 5, tools: [send_email, http_get, "delete_*", "transfer_*"] }
    off_hours: { enabled: false, weight: 5, hours_utc: [6, 20], window_minutes: 240 }
    zombie_resource: { weight: 10, window_minutes: 30 }
    unlabeled_resource: { weight: 5, window_minutes: 60 }
    # Claude Code telemetry
    permission_bypass: { weight: 30, window_minutes: 60 }                 # --dangerously-skip-permissions
    unapproved_mcp_server: { weight: 25, window_minutes: 60, tools: [demo, argent, github, "acme-*"] }
    rejected_edit_storm: { weight: 15, count: 5, window_minutes: 10 }     # an agent pushing past "no"
    decoy_touch: { weight: 100, window_minutes: 60 }     # opened a trap or moved its content on: restricted at once
    decoy_mention: { weight: 30, window_minutes: 60 }    # asked for a trap by name: an alert, maybe just curiosity
  # Incidents add their weight to the person's insider-risk score (insider_risk: watch 30, restricted 120).
  response:
    auto: true                 # off: only recommend
    restrict_rules: [decoy_touch]  # restricted at once (every request blocked); only an admin lifts it
    tighten_budget_scale: 0.25 # what "Tighten budget" applies to someone under watch

# principals:                  # usually written by the admin dashboard into admin_overlay
#   carol: { status: quarantined, reason: "investigating incident 4f2a" }
principals: {}

usage:
  path: data/usage.sqlite      # durable usage, leases, incidents, approvals

# --- The organization: departments and their teams (the console's org units) --------
# A team listed nowhere belongs to department "Unassigned". An API key may name its own `department`.

org:
  name: ACME Bank
  departments:
    Engineering:
      owner: cto-office
      teams: [engineering, payments, mobile, web, data-platform, sre, core-banking, cards, lending, identity,
              api-gateway, devex, qa-automation, fraud-engineering]
    Platform & Security:
      owner: ciso-office
      teams: [platform, security, it-ops, cloud-infra, network]
    Data & Analytics:
      owner: chief-data-office
      teams: [analytics, ml, bi, data-governance, research]
    Finance:
      owner: cfo-office
      teams: [finance, treasury, risk, accounting, tax]
    Operations:
      owner: coo-office
      teams: [customer-ops, compliance, procurement, legal, hr, facilities]
    Sales & Support:
      owner: cro-office
      teams: [sales-emea, sales-amer, sales-apac, support, marketing, interns]

privacy:
  show_risk_to_employee: true  # employees see the incidents and score about them
  require_reason_for_content: true

admin_overlay: data/admin-overlay.yaml   # restrictions set from the dashboard; merged over this file

# --- Per-team overrides -------------------------------------------------------

teams:
  finance:
    controls:
      pii: { mode: block, entities: { credit_card: block, iban: block } }   # never send card/account numbers to a model
  interns:
    controls:
      prompt_injection: { thresholds: { block: 0.6, warn: 0.4, log: 0.2 } }
  platform:
    controls:
      pii: { mode: log }                   # automation handles synthetic data; observe only

audit:
  path: data/audit.jsonl
  store_raw_text: false    # GDPR: detected spans are masked in every event; SHA-256 of the original is kept
  ring_size: 2000
