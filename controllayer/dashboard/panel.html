<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Control Layer</title>
<link rel="stylesheet" href="/ui/core.css">
</head>
<body>
<div id="acl-root"></div>
<script src="/ui/core.js"></script>
<script>
  // Theme files register window.ACL_THEME and load their component library's stylesheet.
  (function () {
    var name = new URLSearchParams(location.search).get("theme");
    if (ACL.THEMES.indexOf(name) < 0) name = "blueprint";
    var s = document.createElement("script");
    s.src = "/ui/themes/" + name + ".js";
    s.onload = function () { ACL.start(); };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
